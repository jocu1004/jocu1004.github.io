<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>점지</title>
<meta name="description" content="꿈 · 오늘 겪은 일 · 사주를 옛 풀이법으로 읽어 오늘의 행운 숫자 여섯을 골라 주는 앱.">
<!--
  ★ 외부 글꼴 · 외부 스크립트 · 추적 코드를 넣지 않는다 (docs/WEBSITE-PRIVACY-SETUP.md §3 B).
    글꼴은 기기에 있는 것으로 그린다. 색은 앱 토큰 그대로다 (docs/154 §1-1).
-->
<style>
  :root {
    --bg: #0D0C0B;        /* background */
    --tx: #F2EBDD;        /* textPrimary */
    --tx2: #C3B9AA;       /* textSecondary */
    --inju: #C64F3C;      /* 인주 */
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--tx);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 72px 24px calc(56px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .seal { width: 72px; height: 72px; border-radius: 16px; display: block; margin: 0 auto 28px; }
  h1 {
    margin: 0 0 20px;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.06em;
    font-family: "Apple SD Gothic Neo", "Noto Serif KR", serif;
  }
  .lead { margin: 0 auto; max-width: 30em; font-size: 16px; color: var(--tx2); text-align: left; }
  .rule { width: 40px; height: 1px; background: #48423B; border: 0; margin: 40px auto; }
  .links { font-size: 15px; }
  .links a { color: var(--inju); text-decoration: none; border-bottom: 1px solid rgba(198,79,60,.45); padding-bottom: 1px; }
  .links a:hover, .links a:focus { color: var(--tx); border-bottom-color: var(--tx); }
  .mail { margin-top: 14px; color: var(--tx2); font-size: 15px; }
  .mail a { color: var(--tx2); }
  footer { margin-top: 48px; color: #8A8177; font-size: 13px; }
  @media (max-width: 400px) {
    main { padding-top: 56px; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<main>
  <img class="seal" src="seal-mark.svg" alt="점지 낙관" width="72" height="72">

  <h1>점지</h1>

  <p class="lead">
    꿈 · 오늘 겪은 일 · 사주를 옛 풀이법으로 읽어 오늘의 행운 숫자 여섯을 골라 주는 앱입니다.
    재미로 보는 앱이고, 모든 계산은 기기 안에서 이루어집니다.
  </p>

  <hr class="rule">

  <p class="links"><a href="privacy.html">개인정보 처리방침</a></p>
  <p class="mail">문의 <a href="mailto:chris.choi330@gmail.com">chris.choi330@gmail.com</a></p>

  <!-- 스토어 링크 자리 — 주소가 나오면 여기에 넣는다
  <p class="links"><a href="">Google Play</a> · <a href="">App Store</a></p>
  -->

  <footer>© 2026 점지</footer>
</main>
</body>
</html>
